<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>조명 컨트롤</title>
<style>
:root{--bg:#f3f1ec;--panel:#fff;--ink:#16181c;--sub:#6a6e76;--line:#d9d6cf;--accent:#f2a900;--aink:#1a1400;--off:#2a2d33;--ok:#2f9e5f;--bad:#d64545;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--panel:#1d2025;--ink:#f1efe9;--sub:#9a9ea6;--line:#2c3037;--off:#2a2d33;--ok:#4cc380;--bad:#ff6b6b;color-scheme:dark}}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.02em}
.lead{color:var(--sub);font-size:14px;margin:0 0 16px}
h2{font-size:16px;margin:24px 2px 10px;color:var(--sub);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;min-height:46px;cursor:pointer;color:#f1efe9;background:var(--off)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.4}
.add{width:100%;background:transparent;border:1.5px dashed var(--sub);color:var(--ink)}
.mini{min-height:38px;padding:6px 12px;font-size:13px}
.onb{flex:1;background:var(--accent);color:var(--aink);font-weight:700;font-size:18px}
.offb{flex:1;font-weight:700;font-size:18px}
.pw.on,.chip.sel{background:var(--accent);color:var(--aink);font-weight:700}
.top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.nm{flex:1;min-width:0;font:inherit;font-size:17px;font-weight:700;color:var(--ink);background:transparent;border:0;border-bottom:1px dashed var(--line);padding:6px 2px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.dot.bad{background:var(--bad)}
.bat{font-size:13px;color:var(--sub);white-space:nowrap}
.bat.low{color:var(--bad);font-weight:700}
.big{font-size:48px;font-weight:700;letter-spacing:-.03em;line-height:1;margin:6px 0 2px}
.big small{font-size:20px;color:var(--sub);font-weight:500}
.big.dim{opacity:.35}
input[type=range]{width:100%;height:44px;accent-color:var(--accent);margin:6px 0 0}
.scale{display:flex;justify-content:space-between;color:var(--sub);font-size:12px}
.row{display:flex;gap:10px;margin-top:12px;align-items:center}
.tl{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:14px;margin-top:12px}
.sw{width:54px;height:32px;border-radius:16px;padding:0;min-height:32px;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-pressed=true]{background:var(--accent)}
.sw[aria-pressed=true]::after{transform:translateX(22px)}
.mem{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.mn{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin-bottom:6px}
.mr{display:flex;align-items:center;gap:10px}
.mr input[type=range]{flex:1;margin:0;height:40px;min-width:0}
.pct{width:46px;text-align:right;font-variant-numeric:tabular-nums;color:var(--sub);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.sub{color:var(--sub);font-size:13px}
#msg{color:var(--sub);font-size:13px;min-height:20px;margin:6px 2px;word-break:break-all}
.warn{background:#4a2b2b;color:#ffd9d9;border-radius:12px;padding:14px;font-size:14px;margin-bottom:14px}
@media (prefers-reduced-motion:reduce){.sw::after{transition:none}}
</style>
</head>
<body>
<main>
<h1>조명 컨트롤</h1>
<p class="lead">조명을 묶어서 한 번에, 또는 하나씩 켜고 끄고 밝기를 조절해요.</p>
<div id="warn" class="warn" hidden>이 브라우저는 블루투스를 지원하지 않아요. iPhone에서는 Bluefy 앱으로 열어주세요.</div>
<div id="msg" role="status"></div>

<h2>그룹</h2>
<div id="groups"></div>
<button class="add" id="addG">그룹 만들기</button>

<h2>조명</h2>
<div id="lights"></div>
<button class="add" id="addL">조명 추가</button>
<p class="sub" style="text-align:center;margin-top:28px">페이지 버전 6</p>
</main>

<script>
(function(){
var S='0000fc00-0000-1000-8000-00805f9b34fb', C='0000fff4-0000-1000-8000-00805f9b34fb', ST='0000fff7-0000-1000-8000-00805f9b34fb';
var lights=[], groups=[], names={}, seq=0, editing={};
function $(i){return document.getElementById(i)}
function say(t){$('msg').textContent=t}
if(!navigator.bluetooth){$('warn').hidden=false;$('addL').disabled=true}

function load(){try{names=JSON.parse(localStorage.getItem('lg_names')||'{}');groups=JSON.parse(localStorage.getItem('lg_groups')||'[]')}catch(e){names={};groups=[]}}
function save(){try{localStorage.setItem('lg_names',JSON.stringify(names));localStorage.setItem('lg_groups',JSON.stringify(groups))}catch(e){}}
function h(t,a,c){var e=document.createElement(t);for(var k in a){var v=a[k];if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k.slice(0,2)==='on')e[k]=v;else e.setAttribute(k,v)}(c||[]).forEach(function(x){if(x)e.appendChild(x)});return e}
function Q(s){return document.querySelectorAll(s)}

// 55 09 05 [손전등] [일반켜짐] [밝기] [배터리?] 00 [검산] AA
function frame(on,lvl,torch){
  var b3=(on&&torch)?1:0, b4=(on&&!torch)?1:0, b5=on?lvl:0;
  var sum=(0x09+0x05+b3+b4+b5+0x1A)&0xFF;
  return new Uint8Array([0x55,0x09,0x05,b3,b4,b5,0x1A,0x00,sum,0xAA]);
}
function write(l,b){return l.char.writeValueWithoutResponse?l.char.writeValueWithoutResponse(b):l.char.writeValue(b)}
function send(l){
  if(!l.ok)return;
  clearTimeout(l.t);
  var d=Date.now()-(l.last||0);
  function go(){l.last=Date.now();write(l,frame(l.on,l.level,l.torch)).catch(function(){l.ok=false;render()})}
  if(d>110)go();else l.t=setTimeout(go,120-d);
}
function find(id){return lights.filter(function(l){return l.id===id})[0]}
function members(g){return g.members.map(find).filter(Boolean)}

function sync(l){
  [].forEach.call(Q('[data-s="'+l.id+'"]'),function(e){e.value=l.level});
  [].forEach.call(Q('[data-p="'+l.id+'"]'),function(e){e.textContent=l.level+'%'});
  [].forEach.call(Q('[data-pn="'+l.id+'"]'),function(e){e.firstChild.textContent=l.level;e.className='big'+(l.on?'':' dim')});
  [].forEach.call(Q('[data-pw="'+l.id+'"]'),function(e){e.textContent=l.on?'켜짐':'꺼짐';e.className='pw mini'+(l.on?' on':'')});
  [].forEach.call(Q('[data-tc="'+l.id+'"]'),function(e){e.setAttribute('aria-pressed',String(l.torch))});
  [].forEach.call(Q('[data-b="'+l.id+'"]'),function(e){
    e.textContent=l.bat==null?'':'배터리 '+l.bat+'%';e.className='bat'+(l.bat!=null&&l.bat<=20?' low':'')});
}
function setOn(l,on){l.on=on;send(l);sync(l)}
function setLevel(l,v){l.level=v;l.on=true;send(l);sync(l)}
function setTorch(l,t){l.torch=t;if(l.on)send(l);sync(l)}

function slider(l){return h('input',{type:'range',min:4,max:100,value:l.level,'data-s':l.id,'aria-label':'밝기',oninput:function(){setLevel(l,parseInt(this.value,10))}})}
function torchSw(l,label){return h('div',{class:'tl'},[h('button',{class:'sw',role:'switch','aria-pressed':String(l.torch),'data-tc':l.id,'aria-label':'손전등 모드',onclick:function(){setTorch(l,!l.torch)}}),h('span',{text:label||'손전등 모드'})])}
function bigNum(l){var b=h('div',{class:'big'+(l.on?'':' dim'),'data-pn':l.id});b.appendChild(document.createTextNode(l.level));b.appendChild(h('small',{text:'%'}));return b}

function lightCard(l){
  var ni=h('input',{class:'nm',value:l.name,'aria-label':'조명 이름',onchange:function(){
    l.name=this.value.trim()||l.name;names[l.id]=l.name;save();render()}});
  return h('div',{class:'card'},[
    h('div',{class:'top'},[h('div',{class:'dot'+(l.ok?'':' bad')}),ni,h('span',{'data-b':l.id})]),
    bigNum(l),slider(l),
    h('div',{class:'scale'},[h('span',{text:'4%'}),h('span',{text:'100%'})]),
    h('div',{class:'row'},[
      h('button',{class:'onb',text:'켜기',onclick:function(){setOn(l,true)}}),
      h('button',{class:'offb',text:'끄기',onclick:function(){setOn(l,false)}})]),
    torchSw(l),
    h('div',{class:'row',style:'justify-content:flex-end'},[
      l.ok?null:h('button',{class:'mini',text:'다시 연결',onclick:function(){reconnect(l)}}),
      h('button',{class:'mini',text:'깜빡이기',onclick:function(){blink(l)}}),
      h('button',{class:'mini',text:'삭제',onclick:function(){try{l.device.gatt.disconnect()}catch(e){}lights=lights.filter(function(x){return x!==l});render()}})])
  ]);
}

function memberRow(l){
  return h('div',{class:'mem'},[
    h('div',{class:'mn'},[h('div',{class:'dot'+(l.ok?'':' bad')}),h('span',{text:l.name,style:'flex:1'}),h('span',{'data-b':l.id})]),
    h('div',{class:'mr'},[
      h('button',{class:'pw mini'+(l.on?' on':''),'data-pw':l.id,text:l.on?'켜짐':'꺼짐',onclick:function(){setOn(l,!l.on)}}),
      slider(l),h('span',{class:'pct','data-p':l.id,text:l.level+'%'})]),
    torchSw(l)
  ]);
}

function groupCard(g){
  var ms=members(g);
  var num=h('div',{class:'big'});num.appendChild(document.createTextNode(g.level));num.appendChild(h('small',{text:'%'}));
  var gs=h('input',{type:'range',min:4,max:100,value:g.level,'aria-label':'그룹 밝기',oninput:function(){
    g.level=parseInt(this.value,10);num.firstChild.textContent=g.level;ms.forEach(function(l){setLevel(l,g.level)})}});
  var gt=h('div',{class:'tl'},[h('button',{class:'sw',role:'switch','aria-pressed':String(!!g.torch),'aria-label':'그룹 손전등',onclick:function(){
    g.torch=!g.torch;this.setAttribute('aria-pressed',String(g.torch));ms.forEach(function(l){setTorch(l,g.torch)})}}),h('span',{text:'그룹 전체 손전등 모드'})]);
  var ni=h('input',{class:'nm',value:g.name,'aria-label':'그룹 이름',onchange:function(){g.name=this.value.trim()||g.name;save();render()}});
  var card=h('div',{class:'card'},[
    h('div',{class:'top'},[ni,
      h('button',{class:'mini',text:editing[g.id]?'완료':'멤버 선택',onclick:function(){editing[g.id]=!editing[g.id];render()}}),
      h('button',{class:'mini',text:'삭제',onclick:function(){groups=groups.filter(function(x){return x!==g});save();render()}})]),
    h('div',{class:'sub',text:ms.length+'개 조명'+(ms.length<g.members.length?' (연결 안 된 조명 포함)':'')})
  ]);
  if(editing[g.id]){
    card.appendChild(h('div',{class:'chips'},lights.map(function(l){
      var sel=g.members.indexOf(l.id)>-1;
      return h('button',{class:'chip mini'+(sel?' sel':''),text:l.name,'aria-pressed':String(sel),onclick:function(){
        var i=g.members.indexOf(l.id);if(i>-1)g.members.splice(i,1);else g.members.push(l.id);save();render()}});
    })));
    if(!lights.length)card.appendChild(h('div',{class:'sub',text:'먼저 조명을 추가해 주세요.'}));
  }
  if(ms.length){
    [num,gs,h('div',{class:'scale'},[h('span',{text:'4%'}),h('span',{text:'100%'})]),
     h('div',{class:'row'},[
       h('button',{class:'onb',text:'전체 켜기',onclick:function(){ms.forEach(function(l){setOn(l,true)})}}),
       h('button',{class:'offb',text:'전체 끄기',onclick:function(){ms.forEach(function(l){setOn(l,false)})}})]),
     gt].forEach(function(x){card.appendChild(x)});
    ms.forEach(function(l){card.appendChild(memberRow(l))});
  }
  return card;
}

function render(){
  var lc=$('lights'),gc=$('groups');lc.innerHTML='';gc.innerHTML='';
  if(!lights.length)lc.appendChild(h('div',{class:'sub',style:'margin:0 2px 12px',text:'연결된 조명이 없어요. 아래 버튼으로 하나씩 추가하세요.'}));
  lights.forEach(function(l){lc.appendChild(lightCard(l))});
  groups.forEach(function(g){gc.appendChild(groupCard(g))});
  lights.forEach(sync);
}

// 조명이 알려주는 상태(켜짐·밝기·배터리) 읽기
function parse(l,v){
  if(!v||v.byteLength<10)return;
  var a=new Uint8Array(v.buffer,v.byteOffset,v.byteLength);
  if(a[0]!==0x55||a[9]!==0xAA)return;
  l.bat=a[6];
  if(Date.now()-(l.last||0)>700){
    var t=a[3]===1, on=t||a[4]===1;
    l.on=on;if(on){l.torch=t;if(a[5]>=4)l.level=a[5]}
  }
  sync(l);
}
function attach(l){
  if(!l.st)return;
  l.st.readValue().then(function(v){parse(l,v)}).catch(function(){});
  l.st.addEventListener('characteristicvaluechanged',function(e){parse(l,e.target.value)});
  l.st.startNotifications().catch(function(){});
}
function link(dev){
  return dev.gatt.connect().then(function(s){return s.getPrimaryServices()}).then(function(sv){
    var i=0;
    function n(){
      if(i>=sv.length)throw new Error('FFF4를 찾지 못했어요');
      var s=sv[i++];
      return s.getCharacteristic(C).then(function(ch){
        return s.getCharacteristic(ST).then(function(st){return {ch:ch,st:st}}).catch(function(){return {ch:ch,st:null}});
      }).catch(n);
    }
    return n();
  });
}
function reconnect(l){
  say('다시 연결하는 중이에요…');
  link(l.device).then(function(r){l.char=r.ch;l.st=r.st;l.ok=true;render();attach(l);say('다시 연결했어요.')})
  .catch(function(e){say('다시 연결 실패: '+(e&&e.message?e.message:String(e)))});
}
function blink(l){
  var q=[1,0,1,0,1],i=0;
  (function step(){
    if(i>=q.length){send(l);return}
    var b=frame(!!q[i],100,false);i++;
    if(l.ok)write(l,b).catch(function(){});
    setTimeout(step,350);
  })();
}

function addLight(){
  var stage='선택';
  say('블루투스 기기 목록에서 EASY-LIGHT를 선택하세요.');
  navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[S]})
  .then(function(dev){
    if(lights.some(function(l){return l.id===dev.id})){say('이미 추가한 조명이에요.');return}
    say('연결하는 중이에요…');stage='연결';
    return link(dev).then(function(r){
      var l={id:dev.id,device:dev,char:r.ch,st:r.st,ok:true,on:false,level:100,torch:false,bat:null,name:names[dev.id]||'조명 '+(++seq)};
      names[dev.id]=l.name;save();
      dev.addEventListener('gattserverdisconnected',function(){l.ok=false;render()});
      lights.push(l);render();attach(l);
      say(l.name+'을(를) 추가했어요. “깜빡이기”로 어떤 조명인지 확인하고 이름을 바꿔 보세요.');
    });
  })
  .catch(function(e){
    if(stage==='선택'&&e&&e.name==='NotFoundError')say('선택을 취소했어요.');
    else say('실패 ['+stage+'] '+(e&&e.name?e.name:typeof e)+': '+(e&&e.message?e.message:String(e)));
  });
}

$('addL').onclick=addLight;
$('addG').onclick=function(){
  var g={id:'g'+Date.now(),name:'그룹 '+(groups.length+1),members:[],level:100,torch:false};
  groups.push(g);editing[g.id]=true;save();render();say('“멤버 선택”에서 이 그룹에 넣을 조명을 골라 주세요.');
};
load();render();
})();
</script>
</body>
</html>
