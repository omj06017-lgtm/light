<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cargo Container Air Light 컨트롤러</title>
<style>
  :root{--bg:#12141a;--card:#1c2029;--line:#2c3240;--txt:#e8ecf3;--sub:#8b94a7;--acc:#4f8cff;--ok:#33c27f;--warn:#e0a030;--bad:#e05555}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;padding:16px;max-width:900px;margin:auto}
  h1{font-size:20px;margin:4px 0 12px}
  h2{font-size:16px;margin:24px 0 10px;color:var(--sub);font-weight:600}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  button{background:#2a3040;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
  button:hover{background:#343b4f}
  button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
  button.danger{color:var(--bad)}
  button:disabled{opacity:.4;cursor:default}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
  .name{font-weight:600;word-break:break-all}
  .badge{font-size:12px;padding:3px 8px;border-radius:99px;background:#2a3040;color:var(--sub);white-space:nowrap}
  .badge.on{background:rgba(51,194,127,.15);color:var(--ok)}
  .badge.busy,.badge.wait{background:rgba(224,160,48,.15);color:var(--warn)}
  .badge.nodev{background:rgba(224,85,85,.15);color:var(--bad)}
  .row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .row label{font-size:13px;color:var(--sub);min-width:36px}
  input[type=range]{flex:1;min-width:100px}
  input[type=color]{width:44px;height:30px;border:none;background:none;padding:0}
  input[type=text]{background:#12141a;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:14px}
  .members{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{font-size:13px;background:#12141a;border:1px solid var(--line);border-radius:99px;padding:4px 10px;display:flex;gap:6px;align-items:center;cursor:pointer}
  .banner{background:rgba(224,160,48,.12);border:1px solid var(--warn);color:var(--warn);padding:10px 12px;border-radius:8px;margin:8px 0;font-size:14px;display:none}
  .empty{color:var(--sub);font-size:14px;padding:12px 0}
</style>
</head>
<body>
<h1>💡 Air Light 컨트롤러</h1>
<div id="banner" class="banner"></div>

<!-- ========== 조명 (맨 위) ========== -->
<div class="bar">
  <button class="pri" data-act="add">＋ 새 조명 추가(최초 1회 페어링)</button>
  <button data-act="connectAll">모두 연결</button>
  <button data-act="disconnectAll">모두 해제</button>
  <button data-act="allOn">모두 켜기</button>
  <button data-act="allOff">모두 끄기</button>
</div>
<h2>조명</h2>
<div id="lights" class="grid"></div>

<!-- ========== 그룹 (조명 아래) ========== -->
<h2>그룹</h2>
<div class="bar">
  <input type="text" id="groupName" placeholder="새 그룹 이름">
  <button data-act="addGroup">그룹 만들기</button>
</div>
<div id="groups" class="grid"></div>

<script>
/* =====================================================================
   ★ 설정: 기존 v9 코드의 값으로 교체하세요 (아래는 임시 예시값)
   ===================================================================== */
const CONFIG = {
  SERVICE_UUID: 0xFFE5,   // TODO: v9의 service UUID
  CHAR_UUID:    0xFFE9,   // TODO: v9의 characteristic UUID
  EXTRA_SERVICES: []      // 필요하면 추가 service UUID
};
const cmd = {               // TODO: v9의 실제 명령 바이트로 교체
  power:      on => Uint8Array.from([0x7E,0x07,0x04,on?0xFF:0x00,0x00,on?0x01:0x00,0x02,0x01,0xEF]),
  brightness: v  => Uint8Array.from([0x7E,0x04,0x01,v,0x01,0xFF,0x02,0x01,0xEF]), // v: 0~100
  color:      (r,g,b) => Uint8Array.from([0x7E,0x07,0x05,0x03,r,g,b,0x10,0xEF])
};

/* ===================== 저장/불러오기 ===================== */
const load = (k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save = ()=>{
  localStorage.setItem('lights',JSON.stringify([...lights.values()].map(l=>({id:l.id,name:l.name,on:l.on,brightness:l.brightness,color:l.color}))));
  localStorage.setItem('groups',JSON.stringify(groups));
};
const lights = new Map();
let groups = load('groups',[]);
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function newLight(m){
  return {id:m.id,name:m.name||'조명',on:m.on??false,brightness:m.brightness??100,color:m.color??'#ffffff',
    device:null,char:null,connected:false,busy:false,watching:false,manual:false,abort:null,q:Promise.resolve(),attached:false};
}
function banner(msg){const b=$('#banner');b.textContent=msg;b.style.display='block'}

/* ===================== 연결 로직 ===================== */
function attach(l,device){
  l.device=device;
  if(l.attached) return;
  l.attached=true;
  device.addEventListener('gattserverdisconnected',()=>{
    l.connected=false;l.char=null;render();
    if(!l.manual) setTimeout(()=>tryConnect(l),1000);   // 자동 재연결 시도
  });
}

const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);

async function doConnect(l){
  const server = await l.device.gatt.connect();
  const svc = await server.getPrimaryService(CONFIG.SERVICE_UUID);
  l.char = await svc.getCharacteristic(CONFIG.CHAR_UUID);
  l.connected=true;
  stopWatch(l);
  render();
}

async function tryConnect(l){
  if(!l.device||l.connected||l.busy||l.manual) return;
  l.busy=true;render();
  try{
    await withTimeout(doConnect(l),8000);
  }catch(e){
    console.warn('연결 실패 → 광고 대기',l.name,e.message);
    watchFor(l);                      // 조명이 켜지면 자동 연결
  }finally{
    l.busy=false;render();
  }
}

async function watchFor(l){
  if(l.watching||l.connected||!l.device||!l.device.watchAdvertisements) return;
  l.watching=true;
  const ac=new AbortController(); l.abort=ac;
  const onAdv=()=>{
    l.device.removeEventListener('advertisementreceived',onAdv);
    stopWatch(l);
    tryConnect(l);
  };
  l.device.addEventListener('advertisementreceived',onAdv);
  try{
    await l.device.watchAdvertisements({signal:ac.signal});
  }catch(e){
    l.device.removeEventListener('advertisementreceived',onAdv);
    l.watching=false;
  }
  render();
}
function stopWatch(l){
  if(l.abort){try{l.abort.abort()}catch{} l.abort=null}
  l.watching=false;
}

function connectAll(){
  lights.forEach(l=>{l.manual=false;tryConnect(l)});
}
function disconnectLight(l){
  l.manual=true;stopWatch(l);
  try{l.device?.gatt?.disconnect()}catch{}
  l.connected=false;render();
}

/* ===================== 새 조명 추가 (최초 1회) ===================== */
async function addLight(){
  try{
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices:true,
      optionalServices:[CONFIG.SERVICE_UUID,...CONFIG.EXTRA_SERVICES]
    });
    let l=lights.get(device.id);
    if(!l){l=newLight({id:device.id,name:device.name||'조명 '+(lights.size+1)});lights.set(device.id,l)}
    attach(l,device);
    l.manual=false;
    save();render();
    tryConnect(l);
  }catch(e){ if(e.name!=='NotFoundError') alert('추가 실패: '+e.message) }
}

/* ===================== 명령 전송 ===================== */
function write(l,data){
  l.q=l.q.then(async()=>{
    if(!l.connected||!l.char) return;
    try{
      if(l.char.properties.writeWithoutResponse) await l.char.writeValueWithoutResponse(data);
      else await l.char.writeValue(data);
    }catch(e){console.warn('write 실패',l.name,e.message)}
  });
}
const hexToRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));

function setPower(l,on){l.on=on;write(l,cmd.power(on))}
function setBrightness(l,v){l.brightness=v;write(l,cmd.brightness(v))}
function setColor(l,hex){l.color=hex;write(l,cmd.color(...hexToRgb(hex)))}

const timers={};
function throttle(key,fn,ms=60){
  clearTimeout(timers[key]);timers[key]=setTimeout(fn,ms);
}

/* ===================== 렌더링 ===================== */
function statusOf(l){
  if(!l.device) return ['nodev','권한 없음(재페어링 필요)'];
  if(l.connected) return ['on','연결됨'];
  if(l.busy) return ['busy','연결 중…'];
  if(l.watching) return ['wait','조명 켜지길 대기 중…'];
  return ['off','끊김'];
}

function render(){
  // 조명
  const lh=[...lights.values()].map(l=>{
    const [cls,txt]=statusOf(l);
    return `<div class="card" data-light="${l.id}">
      <div class="head"><span class="name">${esc(l.name)}</span><span class="badge ${cls}">${txt}</span></div>
      <div class="bar" style="margin:0">
        ${l.connected
          ? `<button data-act="disc" data-id="${l.id}">해제</button>`
          : `<button class="pri" data-act="conn" data-id="${l.id}" ${l.device?'':'disabled'}>연결</button>`}
        <button data-act="toggle" data-id="${l.id}" ${l.connected?'':'disabled'}>${l.on?'끄기':'켜기'}</button>
        <button data-act="rename" data-id="${l.id}">이름</button>
        <button class="danger" data-act="del" data-id="${l.id}">삭제</button>
      </div>
      <div class="row"><label>밝기</label><input type="range" class="bri" min="1" max="100" value="${l.brightness}" data-in="bri" data-id="${l.id}"></div>
      <div class="row"><label>색상</label><input type="color" class="col" value="${l.color}" data-in="col" data-id="${l.id}"></div>
    </div>`;
  }).join('');
  $('#lights').innerHTML = lh || '<div class="empty">등록된 조명이 없습니다. “새 조명 추가”로 한 번만 페어링하세요.</div>';

  // 그룹
  const gh=groups.map(g=>`
    <div class="card" data-group="${g.id}">
      <div class="head"><span class="name">${esc(g.name)}</span>
        <span><button data-act="renameG" data-id="${g.id}">이름</button>
        <button class="danger" data-act="delG" data-id="${g.id}">삭제</button></span></div>
      <div class="bar" style="margin:0">
        <button data-act="gOn" data-id="${g.id}">켜기</button>
        <button data-act="gOff" data-id="${g.id}">끄기</button>
        <button data-act="gConn" data-id="${g.id}">연결</button>
      </div>
      <div class="row"><label>밝기</label><input type="range" min="1" max="100" value="100" data-in="gbri" data-id="${g.id}"></div>
      <div class="row"><label>색상</label><input type="color" value="#ffffff" data-in="gcol" data-id="${g.id}"></div>
      <div class="members">${[...lights.values()].map(l=>`
        <label class="chip"><input type="checkbox" data-in="member" data-id="${g.id}" data-light="${l.id}" ${g.members.includes(l.id)?'checked':''}>${esc(l.name)}</label>`).join('')||'<span class="empty">조명 없음</span>'}</div>
    </div>`).join('');
  $('#groups').innerHTML = gh || '<div class="empty">그룹이 없습니다.</div>';
}

/* ===================== 이벤트 ===================== */
const groupLights=g=>g.members.map(id=>lights.get(id)).filter(Boolean);

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;
  const l=lights.get(id), g=groups.find(x=>x.id===id);
  switch(act){
    case 'add': addLight();break;
    case 'connectAll': connectAll();break;
    case 'disconnectAll': lights.forEach(disconnectLight);break;
    case 'allOn': lights.forEach(x=>x.connected&&setPower(x,true));save();render();break;
    case 'allOff': lights.forEach(x=>x.connected&&setPower(x,false));save();render();break;
    case 'conn': l.manual=false;tryConnect(l);break;
    case 'disc': disconnectLight(l);break;
    case 'toggle': setPower(l,!l.on);save();render();break;
    case 'rename': {const n=prompt('조명 이름',l.name);if(n){l.name=n;save();render()}break}
    case 'del':
      if(confirm(`"${l.name}" 삭제할까요?`)){
        disconnectLight(l);
        try{l.device?.forget?.()}catch{}
        lights.delete(id);groups.forEach(x=>x.members=x.members.filter(m=>m!==id));
        save();render();
      }break;
    case 'addGroup': {
      const inp=$('#groupName');const n=inp.value.trim();if(!n)return;
      groups.push({id:'g'+Date.now(),name:n,members:[]});inp.value='';save();render();break}
    case 'renameG': {const n=prompt('그룹 이름',g.name);if(n){g.name=n;save();render()}break}
    case 'delG': if(confirm(`"${g.name}" 그룹 삭제?`)){groups=groups.filter(x=>x.id!==id);save();render()}break;
    case 'gOn': groupLights(g).forEach(x=>x.connected&&setPower(x,true));save();render();break;
    case 'gOff': groupLights(g).forEach(x=>x.connected&&setPower(x,false));save();render();break;
    case 'gConn': groupLights(g).forEach(x=>{x.manual=false;tryConnect(x)});break;
  }
});

document.addEventListener('input',e=>{
  const t=e.target, k=t.dataset.in; if(!k) return;
  const id=t.dataset.id;
  if(k==='bri'){const l=lights.get(id);l.brightness=+t.value;throttle('b'+id,()=>{setBrightness(l,l.brightness);save()})}
  if(k==='col'){const l=lights.get(id);l.color=t.value;throttle('c'+id,()=>{setColor(l,l.color);save()})}
  if(k==='gbri'){const g=groups.find(x=>x.id===id);
    groupLights(g).forEach(l=>{l.brightness=+t.value;
      const s=document.querySelector(`[data-light="${l.id}"] .bri`);if(s)s.value=t.value;
      throttle('b'+l.id,()=>setBrightness(l,l.brightness))});save()}
  if(k==='gcol'){const g=groups.find(x=>x.id===id);
    groupLights(g).forEach(l=>{l.color=t.value;
      const s=document.querySelector(`[data-light="${l.id}"] .col`);if(s)s.value=t.value;
      throttle('c'+l.id,()=>setColor(l,l.color))});save()}
});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.in==='member'){
    const g=groups.find(x=>x.id===t.dataset.id), lid=t.dataset.light;
    g.members = t.checked ? [...new Set([...g.members,lid])] : g.members.filter(m=>m!==lid);
    save();
  }
});

/* ===================== 시작 ===================== */
async function init(){
  if(!navigator.bluetooth){
    banner('이 브라우저는 Web Bluetooth를 지원하지 않습니다. PC/안드로이드의 Chrome 또는 Edge를 사용하세요. (iOS는 Bluefy 앱)');
    return;
  }
  load('lights',[]).forEach(m=>lights.set(m.id,newLight(m)));

  if(navigator.bluetooth.getDevices){
    try{
      const devs=await navigator.bluetooth.getDevices();
      devs.forEach(d=>{
        let l=lights.get(d.id);
        if(!l){l=newLight({id:d.id,name:d.name||'조명'});lights.set(d.id,l)}
        attach(l,d);
      });
      save();render();
      connectAll();                       // 선택 창 없이 자동 연결
    }catch(e){console.warn(e);render()}
  }else{
    banner('이 브라우저는 자동 재연결(getDevices)을 지원하지 않습니다. chrome://flags/#enable-web-bluetooth-new-permissions-backend 를 Enabled로 바꾸고 Chrome을 재시작하세요.');
    render();
  }
}
render();
init();
</script>
</body>
</html>
